name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build .app (no code signing)
        run: |
          xcodebuild -project DNTweaks.xcodeproj \
            -scheme DNTweaks \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package as unsigned IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/DNTweaks.app Payload/
          zip -r DNTweaks-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNTweaks-unsigned-ipa
          path: DNTweaks-unsigned.ipa
